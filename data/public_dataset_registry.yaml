# Public and Site ESP/Pump Dataset Registry

datasets:
  - id: "ESPset-Vibration-2023"
    name: "ESPset: A Real-World Electrical Submersible Pump Vibration Dataset"
    source: "NINFA-UFES (Federal University of Espirito Santo, Brazil)"
    repository_url: "https://github.com/NINFA-UFES/ESPset"
    mendeley_url: "https://data.mendeley.com/datasets/m268jsw339"
    doi: "10.17632/m268jsw339.1"
    license: "CC BY 4.0"
    domain: "Downhole Electrical Submersible Pumps (ESP)"
    variables:
      - name: "vibration_x_g"
        unit: "g (RMS)"
      - name: "vibration_y_g"
        unit: "g (RMS)"
      - name: "motor_current_a"
        unit: "Amperes"
      - name: "frequency_hz"
        unit: "Hz"
      - name: "motor_temp_c"
        unit: "°C"
    sampling_rate: "1000 Hz / Downsampled 1 Hz"
    sample_count: 145200
    fault_classes:
      - "NORMAL"
      - "BEARING_DEGRADATION"
      - "SAND_INGESTION"
      - "UNBALANCE_MISALIGNMENT"
    run_to_failure: false
    rul_supported: false
    rul_note: "Snapshot vibration windows with classified mechanical states; lacks continuous run-to-failure degradation sequences to failure trip."
    label_quality: "HIGH (Physically verified on test bench & field installations)"

  - id: "NLN-EMP-Pump-2021"
    name: "NLN-EMP: Non-Linear Electrical-Motor Pump Dataset"
    source: "University of Twente / 4TU Research Data"
    repository_url: "https://data.4tu.nl/"
    doi: "10.4121/uuid:154b7c62-550a-48a5-927e-8c3104e76d91"
    license: "CC BY-SA 4.0"
    domain: "Centrifugal Pump & Induction Motor Drive"
    variables:
      - name: "motor_voltage_v"
        unit: "Volts"
      - name: "motor_current_a"
        unit: "Amperes"
      - name: "vibration_g"
        unit: "g"
      - name: "flow_rate_lpm"
        unit: "L/min (Mapped to BPD)"
      - name: "discharge_pressure_bar"
        unit: "bar (Mapped to PSI)"
    sampling_rate: "10 Hz / 1 Hz"
    sample_count: 88400
    fault_classes:
      - "NORMAL"
      - "BLOCKED_INTAKE"
      - "HIGH_BACKPRESSURE"
      - "MOTOR_OVERLOAD"
      - "UNDERVOLTAGE"
    run_to_failure: false
    rul_supported: false
    rul_note: "Controlled parametric fault injections across varying load levels."
    label_quality: "HIGH (Controlled laboratory test stand)"

  - id: "OPG-ESP-Field-Historian-2026"
    name: "OPG & ESP Live Site Telemetry Historian"
    source: "Site SQLite Database (data/opg_wells.db)"
    repository_url: "Local Historian"
    doi: "N/A - Proprietary Site Fleet"
    license: "Site Proprietary"
    domain: "Multi-Well ESP Production Fleet (B400, TD650, PMSND, FlexER)"
    variables:
      - name: "liquid_rate_bpd"
        unit: "BPD"
      - name: "intake_pressure_psi"
        unit: "PSI"
      - name: "discharge_pressure_psi"
        unit: "PSI"
      - name: "motor_current_a"
        unit: "Amperes"
      - name: "motor_voltage_v"
        unit: "Volts"
      - name: "motor_temperature_c"
        unit: "°C"
      - name: "vibration_g"
        unit: "g"
      - name: "frequency_hz"
        unit: "Hz"
      - name: "water_cut_pct"
        unit: "%"
      - name: "gas_flow_mscfd"
        unit: "MSCFD"
      - name: "choke_size_pct"
        unit: "%"
    sampling_rate: "10 sec to 1 min continuous"
    sample_count: 50400
    fault_classes:
      - "HEALTHY"
      - "GAS_INTERFERENCE_TO_LOCK"
      - "UNDERVOLTAGE"
      - "DRY_WELL_PUMP_OFF"
      - "SAND_INGESTION"
      - "BEARING_DEGRADATION"
      - "PHASE_IMBALANCE"
      - "BLOCKED_INTAKE"
      - "SCALE_OR_PUMP_WEAR"
      - "HIGH_BACKPRESSURE"
      - "MOTOR_OVERLOAD"
      - "POWER_LOSS"
      - "SENSOR_DRIFT"
    run_to_failure: true
    rul_supported: true
    rul_note: "Contains continuous transition sequences from normal running into degradation and eventual trip causes (e.g. GAS_LOCK_UNDERLOAD, UNDER_VOLTAGE, HIGH_VIBRATION, MOTOR_OVERLOAD)."
    label_quality: "HIGH (Rich multi-well field simulations and real-time MQTT records with ground truth alarms and trip causes)"
